<div class="login-container">
  <h2>To Do List</h2>
  <h3>Login below to view your list</h3>
  <form (ngSubmit)="login()">
    <!-- Username field -->
    <mat-form-field appearance="fill">
      <mat-label>Username</mat-label>
      <input matInput type="text" id="username" [(ngModel)]="username" name="username" required />
    </mat-form-field>

    <!-- Password field -->
    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput type="password" id="password" [(ngModel)]="password" name="password" required />
    </mat-form-field>

    <!-- Submit button -->
    <button mat-raised-button color="primary" type="submit">Login</button>
  </form>

  <!-- Add the "Register here" link -->
  <p>Don't have an account? <a routerLink="/register">Register here</a></p>

  <!-- Error message display -->
  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</div>
